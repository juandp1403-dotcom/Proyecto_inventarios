<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Inventarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css?v=1" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
</head>

<body>

<div class="login-page">
    <div class="container d-flex justify-content-center">

        <div class="card login-card shadow-lg border-0">
            <div class="card-body p-4">

                <h3 class="text-center mb-4">Crear Cuenta</h3>

                <div id="alertContainer"></div>

                <form id="registroForm" action="{{ url_for('usuario.crear_usuario') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="usuario@dominio.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="********" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="password_confirm" class="form-control" placeholder="********" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option value="">Selecciona un rol</option>
                            <option value="aprendiz">Aprendiz</option>
                            <option value="instructor">Instructor</option>
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                    </div>
                </form>

                <hr>

                <p class="text-center mb-0">
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('dashboard') }}">Inicia sesión aquí</a>
                </p>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script>
document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = this;
    const formData = new FormData(form);

    const alertContainer = document.getElementById('alertContainer');
    alertContainer.innerHTML = '';

    try {
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            alertContainer.innerHTML =
                '<div class="alert alert-success alert-dismissible fade show" role="alert">' +
                'Cuenta creada correctamente. Redirigiendo...' +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                '</div>';
            setTimeout(function() {
                window.location.href = '/dashboard';
            }, 1500);
        } else {
            alertContainer.innerHTML =
                '<div class="alert alert-danger alert-dismissible fade show" role="alert">' +
                (data.error || 'Error al crear la cuenta') +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                '</div>';
        }
    } catch (error) {
        alertContainer.innerHTML =
            '<div class="alert alert-danger alert-dismissible fade show" role="alert">' +
            'Error de conexión. Intenta de nuevo.' +
            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
            '</div>';
    }
});
</script>

</body>
</html>
