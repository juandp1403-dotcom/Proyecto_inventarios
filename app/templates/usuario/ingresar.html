<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Inventarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css?v=1" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #8DD7F2 0%, #9268F0 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: 1px solid #28a745;
            border-radius: 10px;
            width: 100%;
            max-width: 480px;
        }
        .btn-primary {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-primary:hover {
            background-color: #218838;
            border-color: #218838;
        }
        .btn-primary:disabled {
            background-color: #28a745;
            border-color: #28a745;
            opacity: 0.65;
        }
        .form-control:focus, .form-select:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card shadow-lg border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Crear Cuenta</h3>

                <div id="alertContainer"></div>

                <form id="registroForm" action="{{ url_for('usuario.crear_usuario') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="usuario@dominio.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="********" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="password_confirm" class="form-control" placeholder="********" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option value="">Selecciona un rol</option>
                            <option value="aprendiz">Aprendiz</option>
                            <option value="instructor">Instructor</option>
                        </select>
                        <small class="text-muted">Los roles de auditor, revisor y admin los asigna un administrador.</small>
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Registrarse</button>
                    </div>
                </form>

                <hr>

                <p class="text-center mb-0">
                    <a href="/dashboard">¿Ya tienes cuenta? Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = this.querySelector('[name="password"]').value;
            const confirm = this.querySelector('[name="password_confirm"]').value;
            const alertContainer = document.getElementById('alertContainer');
            const btn = document.getElementById('btnSubmit');

            alertContainer.innerHTML = '';

            if (password !== confirm) {
                alertContainer.innerHTML =
                    '<div class="alert alert-danger alert-dismissible fade show" role="alert">' +
                    'Las contraseñas no coinciden.' +
                    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                    '</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Registrando...';

            try {
                const formData = new FormData(this);
                const jsonData = {};
                const csrfToken = formData.get('csrf_token');
                formData.forEach((value, key) => { jsonData[key] = value; });

                const response = await fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(jsonData)
                });

                const data = await response.json();

                if (response.ok) {
                    alertContainer.innerHTML =
                        '<div class="alert alert-success alert-dismissible fade show" role="alert">' +
                        'Cuenta creada correctamente. Redirigiendo...' +
                        '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                        '</div>';
                    setTimeout(function () {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    alertContainer.innerHTML =
                        '<div class="alert alert-danger alert-dismissible fade show" role="alert">' +
                        (data.error || 'Error al crear la cuenta') +
                        '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                        '</div>';
                    btn.disabled = false;
                    btn.textContent = 'Registrarse';
                }
            } catch (error) {
                alertContainer.innerHTML =
                    '<div class="alert alert-danger alert-dismissible fade show" role="alert">' +
                    'Error de conexión. Intenta de nuevo.' +
                    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                    '</div>';
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
